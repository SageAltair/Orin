services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-orin}
      POSTGRES_USER: ${POSTGRES_USER:-orin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    init: true
    pids_limit: 200
    mem_limit: ${DB_MEMORY_LIMIT:-1g}
    cpus: ${DB_CPU_LIMIT:-2.0}
    shm_size: 256m
    logging: &bounded-logs
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
  migrate:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    env_file: .env
    environment:
      APP_ENV: production
      AUTH_REFRESH_COOKIE_SECURE: "true"
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    pids_limit: 100
    mem_limit: 512m
    cpus: 1.0
    logging: *bounded-logs
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    env_file: .env
    environment:
      APP_ENV: production
      BACKGROUND_WORKER_ENABLED: "true"
      AUTH_REFRESH_COOKIE_SECURE: "true"
      ATTACHMENT_STORAGE_PATH: /app/data/attachments
    command: ["uvicorn", "orin_api.main:app", "--host", "0.0.0.0", "--port", "8000", "--forwarded-allow-ips=172.30.0.0/24"]
    volumes:
      - orin_attachments:/app/data/attachments
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=128m,noexec,nosuid,nodev
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    pids_limit: 200
    mem_limit: ${API_MEMORY_LIMIT:-1g}
    cpus: ${API_CPU_LIMIT:-2.0}
    stop_grace_period: 20s
    logging: *bounded-logs
  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.production.Dockerfile
    ports:
      - "127.0.0.1:${WEB_PORT:-5273}:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
      - /var/cache/nginx:size=32m,noexec,nosuid,nodev
      - /var/run:size=4m,noexec,nosuid,nodev
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    pids_limit: 100
    mem_limit: ${WEB_MEMORY_LIMIT:-256m}
    cpus: ${WEB_CPU_LIMIT:-1.0}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health/live"]
      interval: 15s
      timeout: 3s
      retries: 5
    logging: *bounded-logs
volumes:
  postgres_data:
  orin_attachments:

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24
