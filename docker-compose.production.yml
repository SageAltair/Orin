services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-orin}
      POSTGRES_USER: ${POSTGRES_USER:-orin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    env_file: .env
    environment:
      APP_ENV: production
      BACKGROUND_WORKER_ENABLED: "true"
      AUTH_REFRESH_COOKIE_SECURE: "true"
      ATTACHMENT_STORAGE_PATH: /app/data/attachments
    command: ["sh", "-c", "alembic upgrade head && uvicorn orin_api.main:app --host 0.0.0.0 --port 8000 --forwarded-allow-ips=172.30.0.0/24"]
    volumes:
      - orin_attachments:/app/data/attachments
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.production.Dockerfile
    ports:
      - "127.0.0.1:${WEB_PORT:-5273}:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
volumes:
  postgres_data:
  orin_attachments:

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24
