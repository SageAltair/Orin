name: Verify Orin
on:
  push:
    branches: [main]
  pull_request:
# Cancel superseded PR heads, but never cancel or coalesce main merge verification.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  web-checks:
    # Independent of backend verification so a backend regression cannot hide web auth failures.
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Verify frontend independently
        working-directory: apps/web
        run: |
          npm ci
          npm run lint
          npm test
          npm run build

  mobile-checks:
    # Run mobile auth tests even when backend verification fails first.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Verify Android client independently
        working-directory: apps/mobile
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run export:android -- --source-maps
      - name: Check Metro source map exposure report
        run: |
          node --test scripts/report-mobile-metro-exposure.test.mjs scripts/check-mobile-metro-exposure.test.mjs
          node scripts/report-mobile-metro-exposure.mjs apps/mobile/dist apps/mobile/mobile-runtime-js-exposure.json
          # A conservative JS-graph regression gate, not native APK or build-tool security clearance.
          node scripts/check-mobile-metro-exposure.mjs apps/mobile/mobile-runtime-js-exposure.json
      - name: Preserve Android JS exposure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-js-dependency-exposure
          path: apps/mobile/mobile-runtime-js-exposure.json
          if-no-files-found: warn

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: orin_test
          POSTGRES_USER: orin
          POSTGRES_PASSWORD: isolated-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orin -d orin_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://orin:isolated-ci-password@localhost:5432/orin_test
      ORIN_FOCUS_TEST_DATABASE_URL: postgresql+psycopg://orin:isolated-ci-password@localhost:5432/orin_test
      AUTH_SECRET_KEY: ci-only-signing-key-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
      AUTH_REFRESH_COOKIE_SECURE: "false"
      CORS_ORIGINS: http://localhost:5273,http://127.0.0.1:4173,http://127.0.0.1:4174
      BACKGROUND_WORKER_ENABLED: "true"
      ORIN_LIVE_E2E: "true"
      ORIN_WORKER_E2E: "true"
      CI: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/mobile/package-lock.json
      - name: Guard local Docker source verification logic
        run: python -m unittest discover -s scripts -p 'test_verify_local_runtime.py'
      - name: Install Python dependencies
        run: |
          python -m pip install -r apps/api/requirements-dev.lock
          python -m pip install --no-deps -e apps/api -e apps/worker
      - name: Backend and worker regressions, including PostgreSQL concurrency
        env:
          BACKGROUND_WORKER_ENABLED: "false"
        run: python -m pytest apps/api/tests apps/worker/tests
      - name: Verify schema upgrade and offline preview
        working-directory: apps/api
        run: |
          python -m alembic upgrade head
          python -m alembic check
          python -m alembic upgrade head --sql > /tmp/orin-migrations.sql
      - name: Install frontend and browser
        working-directory: apps/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Frontend checks
        working-directory: apps/web
        run: |
          npm run lint
          npm test
          npm run build
      - name: Mobile Android client checks
        working-directory: apps/mobile
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run export:android
      - name: Start isolated API
        run: |
          uvicorn orin_api.main:app --host 127.0.0.1 --port 8100 > /tmp/orin-api.log 2>&1 &
          python -c "import time,urllib.request; time.sleep(2); urllib.request.urlopen('http://127.0.0.1:8100/health/ready')"
      - name: Browser workflows against mocks and the isolated API
        working-directory: apps/web
        run: npm run test:e2e -- --workers=2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: verification-diagnostics
          path: |
            apps/web/test-results/
            /tmp/orin-api.log

  production-containers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Prepare isolated production configuration
        run: |
          cp .env.example .env
          python - <<'PYCODE'
          from pathlib import Path
          import secrets
          p = Path('.env')
          s = p.read_text().replace('AUTH_SECRET_KEY=\n', 'AUTH_SECRET_KEY=' + secrets.token_hex(32) + '\n')
          s = s.replace('CORS_ORIGINS=http://localhost:5273', 'CORS_ORIGINS=https://orin.invalid')
          s = s.replace('WEB_APP_URL=http://localhost:5273', 'WEB_APP_URL=https://orin.invalid')
          s += '\nWEB_PORT=5274\n'
          p.write_text(s)
          PYCODE
      - name: Build and start the production template
        run: docker compose --project-name orin-production-ci -f docker-compose.production.yml up --build --wait --wait-timeout 180
      - name: Verify static frontend and database readiness through the proxy
        run: |
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:5274/health/ready
          curl --fail http://127.0.0.1:5274/health/live
          ! curl --fail http://127.0.0.1:5274/health/metrics
          docker compose --project-name orin-production-ci -f docker-compose.production.yml exec -T api python -c "import urllib.request; data=urllib.request.urlopen('http://127.0.0.1:8000/health/metrics').read(); assert b'orin_http_requests_total' in data"
          curl --fail http://127.0.0.1:5274/ | grep 'id="root"'
          docker build -f infrastructure/docker/worker.Dockerfile -t orin-worker-ci .
      - name: Capture container diagnostics
        if: failure()
        run: docker compose --project-name orin-production-ci -f docker-compose.production.yml logs
      - name: Remove only the isolated CI stack and its test volumes
        if: always()
        run: docker compose --project-name orin-production-ci -f docker-compose.production.yml down -v

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Audit locked dependencies
        run: |
          python -m pip install pip-audit==2.9.0
          python -m pip_audit -r apps/api/requirements.lock
          # The test runner installs this separate lock; scan it too.
          python -m pip_audit -r apps/api/requirements-dev.lock
          python -m pip_audit -r apps/worker/requirements.lock
          cd apps/web
          npm ci
          npm audit --omit=dev --audit-level=high
          # Vite is a dev dependency but powers the exposed local development server.
          # Include dev dependencies and fail on moderate advisories as well.
          npm audit --audit-level=moderate
      - name: Verify mobile audit regression policy
        run: node --test scripts/check-mobile-audit.test.mjs scripts/check-mobile-permissions.test.mjs
      - name: Audit mobile locked dependencies (critical zero, high baseline ceiling)
        working-directory: apps/mobile
        run: |
          npm audit --package-lock-only --json > mobile-audit.json || true
          node ../../scripts/check-mobile-audit.mjs mobile-audit.json
      - name: Preserve mobile dependency audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mobile-dependency-audit
          path: apps/mobile/mobile-audit.json
          if-no-files-found: warn
      - name: Scan repository for secrets and unsafe configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
      - name: Build production images for scanning
        run: |
          docker build -f infrastructure/docker/api.Dockerfile -t orin-api:ci .
          docker build -f infrastructure/docker/web.production.Dockerfile -t orin-web:ci .
      - name: Scan API image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: orin-api:ci
          format: table
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: "1"
      - name: Scan web image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: orin-web:ci
          format: table
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: "1"
      - name: Generate release SBOM
        uses: anchore/sbom-action@7b36ad622f042cab6f59a75c2ac24ccb256e9b45 # v0.20.4
        with:
          path: .
          format: spdx-json
          output-file: orin-sbom.spdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: orin-sbom
          path: orin-sbom.spdx.json

  isolated-acceptance:
    # Independent disposable databases prevent signup rate-limit collisions.
    # The existing acceptance job name remains stable for required CI checks.
    name: ${{ matrix.suite == 'isolated-acceptance.spec.ts' && 'isolated-acceptance' || 'isolated-worker-acceptance' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [isolated-acceptance.spec.ts, worker-stack.spec.ts]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: orin_acceptance_ci
          POSTGRES_USER: orin_acceptance
          POSTGRES_PASSWORD: disposable-acceptance-only
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U orin_acceptance -d orin_acceptance_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://orin_acceptance:disposable-acceptance-only@127.0.0.1:15432/orin_acceptance_ci
      AUTH_SECRET_KEY: ci-isolated-acceptance-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
      AUTH_REFRESH_COOKIE_SECURE: "false"
      CORS_ORIGINS: http://127.0.0.1:15273
      WEB_APP_URL: http://127.0.0.1:15273
      VITE_API_BASE_URL: http://127.0.0.1:18100
      VITE_FOCUS_ENABLED: "true"
      BACKGROUND_WORKER_ENABLED: "true"
      ORIN_ISOLATED_E2E: "true"
      ORIN_LIVE_E2E: "true"
      ORIN_WORKER_E2E: "true"
      CI: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install isolated API and browser dependencies
        run: |
          python -m pip install -r apps/api/requirements-dev.lock
          python -m pip install --no-deps -e apps/api -e apps/worker
          cd apps/web
          npm ci
          npx playwright install --with-deps chromium
      - name: Initialize disposable PostgreSQL schema
        working-directory: apps/api
        run: python -m alembic upgrade head
      - name: Start dedicated API and web processes
        run: |
          uvicorn orin_api.main:app --host 127.0.0.1 --port 18100 > /tmp/orin-isolated-api.log 2>&1 &
          (
            cd apps/web
            npm run dev -- --host 127.0.0.1 --port 15273 --strictPort > /tmp/orin-isolated-web.log 2>&1
          ) &
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:18100/health/ready > /dev/null &&
               curl --fail --silent http://127.0.0.1:15273/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Isolated API/web did not become ready" >&2
          exit 1
      - name: Cross-feature real-browser acceptance on disposable data
        working-directory: apps/web
        run: npm run test:e2e -- e2e/${{ matrix.suite }} --project=chromium --workers=1
      - name: Preserve isolated acceptance diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: isolated-acceptance-diagnostics-${{ matrix.suite }}
          path: |
            /tmp/orin-isolated-api.log
            /tmp/orin-isolated-web.log
            apps/web/test-results/
