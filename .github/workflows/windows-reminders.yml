name: Windows reminder smoke

on:
  pull_request:
    paths:
      - apps/worker/src/orin_worker/windows_reminders.py
      - apps/worker/tests/test_windows_reminders.py
      - apps/worker/scripts/register-windows-reminder-shortcut.ps1
      - .github/workflows/windows-reminders.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-reminder-tests:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install isolated worker dependencies
        run: |
          python -m pip install -r apps/worker/requirements.lock
          python -m pip install pytest==9.0.2
          python -m pip install --no-deps -e apps/worker
      - name: Run Windows reminder regressions (mocked API and toasts)
        run: python -m pytest apps/worker/tests/test_windows_reminders.py -q
      - name: Resolve real Windows system PowerShell (no toast)
        run: python -c "from orin_worker.windows_reminders import _powershell_executable; print(_powershell_executable())"
      - name: Verify shortcut identity in a disposable runner profile (no toast)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $profileRoot = Join-Path $env:RUNNER_TEMP 'orin-reminder-shortcut-ci'
          $shortcut = Join-Path $profileRoot 'Microsoft\Windows\Start Menu\Programs\Orin Task Reminders.lnk'
          $installer = Join-Path $env:GITHUB_WORKSPACE 'apps/worker/scripts/register-windows-reminder-shortcut.ps1'
          $python = (Get-Command python).Source
          & $installer -Install -PythonPath $python -AppDataRoot $profileRoot
          if (-not (Test-Path -LiteralPath $shortcut)) { throw 'Registration did not create the test shortcut.' }
          $env:APPDATA = $profileRoot
          $env:ORIN_WINDOWS_REMINDERS_APP_ID = 'Oddly.Orin.Reminders'
          $env:ORIN_WINDOWS_REMINDERS_SHORTCUT = $shortcut
          orin-windows-reminders-check
          & $installer -Install -PythonPath $python -AppDataRoot $profileRoot
          try {
            & $installer -Remove -AppId 'Other.App.Identity' -AppDataRoot $profileRoot
            throw 'Wrong-identity removal unexpectedly succeeded.'
          } catch {
            if ($_.Exception.Message -notlike '*different AppUserModelID*') { throw }
          }
          if (-not (Test-Path -LiteralPath $shortcut)) { throw 'Wrong-identity refusal removed the shortcut.' }
          & $installer -Remove -AppDataRoot $profileRoot
          if (Test-Path -LiteralPath $shortcut) { throw 'Removal left a test shortcut.' }
          $foreign = (New-Object -ComObject WScript.Shell).CreateShortcut($shortcut)
          $foreign.TargetPath = $python
          $foreign.Arguments = '-m other_module'
          $foreign.Save()
          try {
            & $installer -Install -PythonPath $python -AppDataRoot $profileRoot
            throw 'Existing unrelated shortcut was overwritten.'
          } catch {
            if ($_.Exception.Message -notlike '*different AppUserModelID*') { throw }
          }
          if (-not (Test-Path -LiteralPath $shortcut)) { throw 'Unrelated shortcut was removed.' }
          Remove-Item -LiteralPath $shortcut
          & $installer -Install -PythonPath $python -AppDataRoot $profileRoot -WhatIf
          if (Test-Path -LiteralPath $shortcut) { throw 'WhatIf unexpectedly created a shortcut.' }
