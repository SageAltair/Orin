name: Creative Studio regression checks

on:
  pull_request:
    branches:
      - feature/focus-tasks
    paths:
      - "apps/api/src/orin_api/creative_*.py"
      - "apps/api/tests/test_creative_studio.py"
      - "apps/api/pyproject.toml"
      - ".github/workflows/creative-studio-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  creative-api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run Creative Studio regression tests
        run: python -m pytest tests/test_creative_studio.py -q
