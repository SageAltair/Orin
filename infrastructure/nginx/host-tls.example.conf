# Install on the host TLS proxy after replacing orin.example and certificate paths.
# This proxy overwrites forwarding headers; it must be the only process able to reach
# the production Compose loopback port.
server {
    listen 80;
    server_name orin.example;
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name orin.example;

    ssl_certificate /etc/letsencrypt/live/orin.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/orin.example/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://127.0.0.1:5273;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 125s;
    }
}
