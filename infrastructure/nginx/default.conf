limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=180r/m;
limit_req_zone $binary_remote_addr zone=expensive:10m rate=20r/m;
limit_conn_zone $binary_remote_addr zone=connections:10m;
# The fixed production Compose subnet uses 172.30.0.1 as its host gateway.
# Only that hop may provide the client address; all public values are otherwise discarded.
set_real_ip_from 172.30.0.1;
real_ip_header X-Forwarded-For;
real_ip_recursive off;
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 21m;
    server_tokens off;
    limit_conn connections 30;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self'; frame-ancestors 'none'" always;
    location ~ ^/api/v1/auth/(login|register)$ {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Request-ID $request_id;
    }
    location /api/ {
        limit_req zone=api burst=60 nodelay;
        proxy_pass http://api:8000;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Request-ID $request_id;
        proxy_hide_header Server;
    }
    location ~ ^/api/v1/(privacy/export|attachments|commands|ai/) {
        limit_req zone=expensive burst=10 nodelay;
        proxy_pass http://api:8000;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Request-ID $request_id;
        proxy_hide_header Server;
    }
    location = /health/live {
        proxy_pass http://api:8000;
    }
    location = /health/ready {
        proxy_pass http://api:8000;
    }
    location = /health/metrics {
        return 404;
    }
    location /health/ {
        return 404;
    }
    location /assets/ {
        expires 1y;
    }
    location / {
        try_files $uri /index.html;
        expires -1;
    }
}
