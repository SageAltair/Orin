[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "orin-worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28,<1.0", "pydantic>=2.7,<3.0"]

[project.scripts]
orin-worker = "orin_worker.main:main"

[tool.setuptools.packages.find]
where = ["src"]
