[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "orin-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.34,<1.0",
  "watchfiles>=0.20,<2.0",
  "pydantic-settings>=2.7,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "alembic>=1.14,<2.0",
  "psycopg[binary]>=3.2,<4.0",
  "email-validator>=2.2,<3.0",
  "pwdlib[argon2]>=0.2,<1.0",
  "PyJWT>=2.10,<3.0",
  "httpx>=0.28,<1.0",
  "cryptography>=43,<52",
  "python-multipart>=0.0.20,<1.0",
  "pypdf>=5,<7",
]

[project.optional-dependencies]
dev = ["pytest>=9.0.3,<10.0", "pytest-asyncio>=1.3,<2.0", "httpx>=0.28,<1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
